global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'nopcommerce'
    static_configs:
      - targets: ['nopcommerce:80']  # MUDADO: nome do container + porta 80
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']