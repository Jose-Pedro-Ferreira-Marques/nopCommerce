services:
    nopcommerce_web:
        build: .
        container_name: nopcommerce
        ports:
            - "80:80"
        depends_on:
            - nopcommerce_database
        networks:
            - nopcommerce_observability
        environment:
            - ConnectionStrings__DefaultConnection=Server=nopcommerce_mssql_server;Database=nopCommerce_Database;User Id=sa;Password=nopCommerce_db_password;TrustServerCertificate=true
            - ASPNETCORE_ENVIRONMENT=Development
        restart: unless-stopped  

    nopcommerce_database:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        container_name: nopcommerce_mssql_server
        environment:
            SA_PASSWORD: "nopCommerce_db_password"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Express"
        networks:
            - nopcommerce_observability
        restart: unless-stopped  

volumes:
  nopcommerce_data:

networks:
  nopcommerce_observability: 
    external: true
    name: nopcommerce_observability